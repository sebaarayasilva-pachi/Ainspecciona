# Desarrollo local: MySQL para Ainspecciona
# Uso: docker compose up -d
# Luego: npx prisma migrate deploy && npm run dev

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ainspecta
      MYSQL_USER: ainspecta
      MYSQL_PASSWORD: ainspecta2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
