<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script>(function(){try{var t=localStorage.getItem("entrega-theme");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest-entrega.json" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <title>Órdenes de Trabajo · Ainspecciona Recepción</title>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw-executive.js").catch(function() {});
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/entrega/assets/entrega.css" />
</head>
<body>
  <div class="app">
    <div id="sidebar"></div>
    <div class="main">
      <header class="topbar no-print">
        <div class="titles">
          <h1>Órdenes de Trabajo</h1>
          <div class="crumb" id="crumb"></div>
        </div>
        <div class="spacer"></div>
        <button class="btn primary" id="btnPrintAll" style="display:none">Imprimir todas</button>
        <div id="projSelector"></div>
        <div id="dateChip"></div>
      </header>
      <div class="content" id="content"></div>
    </div>
  </div>
  <div id="otPrintArea"></div>

  <script src="/entrega/assets/entrega-app.js"></script>
  <script>
    (async function () {
      const E = window.Entrega;
      const content = document.getElementById("content");
      try {
        const seed = await E.loadSeed();
        const kpiCatalog = await E.loadKpiCatalog(seed);
        const project = E.getProject(seed, E.currentProjectId());
        E.setProject(project.id);

        document.getElementById("sidebar").innerHTML = E.renderSidebar("ot", project, seed);
        document.getElementById("projSelector").innerHTML = E.projectSelector(seed, project);
        document.getElementById("dateChip").innerHTML = E.dateChip(project);
        document.getElementById("crumb").textContent = `${project.name} · OT del proyecto`;
        E.bindProjectSelector();

        const findingsMap = await E.loadProjectFindingsMap(seed, project.id);
        let ots = E.projectOtsFromFindingsMap(findingsMap, seed, project.id, kpiCatalog);
        ots.sort((a, b) => b.criticos - a.criticos || b.count - a.count);
        window.__projectOts = ots;

        const printCtx = {
          project,
          tenant: seed.tenant,
          emittedAt: new Date().toLocaleDateString("es-CL", { day: "2-digit", month: "2-digit", year: "numeric" }),
        };

        window.__printOt = function (idx) {
          const ot = window.__projectOts[idx];
          if (!ot) return;
          E.printOtDocuments(E.otPrintSheetHtml(ot, printCtx));
        };

        document.getElementById("btnPrintAll").addEventListener("click", () => {
          E.printOtDocuments(E.otPrintAllHtml(window.__projectOts, printCtx));
        });

        const printOne = E.qs("print", "");
        if (printOne) {
          const hit = ots.find((o) => o.id === printOne);
          if (hit) setTimeout(() => E.printOtDocuments(E.otPrintSheetHtml(hit, printCtx)), 400);
        }

        if (!ots.length) {
          content.innerHTML = `
            <div class="kpi-row">
              <div class="kpi"><div class="k-label">OT activas</div><div class="k-value">0</div></div>
            </div>
            <div class="card pad-lg"><div class="card-title">Sin OT activas</div>
              <p class="muted" style="margin-top:8px">No hay hallazgos abiertos con OT generadas en este proyecto.</p></div>`;
          return;
        }

        document.getElementById("btnPrintAll").style.display = "";
        const atrasadas = ots.filter((o) => o.estado && o.estado.cls === "critico").length;
        const enProceso = ots.filter((o) => o.estado && o.estado.cls === "pendiente_intermedio").length;
        const pendientes = ots.filter((o) => o.estado && o.estado.cls === "pendiente_menor").length;

        const rows = ots
          .map((ot, i) => {
            const esc = E.escapeHtml;
            const estadoCls = (ot.estado && ot.estado.cls) || "pendiente_menor";
            const estadoLabel = (ot.estado && ot.estado.label) || "â€”";
            const unidad = ot.unidad && ot.unidad !== "â€”"
              ? `<a class="link" href="${E.withProject("/entrega/unidad", project.id)}&u=${encodeURIComponent(ot.unidad)}&tab=ot" onclick="event.stopPropagation()">${esc(ot.unidad)}</a>`
              : esc(ot.unidad || "â€”");
            return (
              `<tr class="clickable ot-row" data-ot="${i}">` +
              `<td><b>${esc(ot.id)}</b></td><td>${unidad}</td><td class="num">${ot.piso ?? "â€”"}</td>` +
              `<td>${esc(ot.kpi)}</td><td>${esc(ot.especialidad)}</td><td class="num">${ot.count || 0}</td>` +
              `<td>${esc(ot.asignado)}</td><td><span class="badge ${estadoCls}">${esc(estadoLabel)}</span></td>` +
              `<td><button class="btn" style="padding:4px 10px;font-size:11px" onclick="event.stopPropagation();window.__printOt(${i})">Imprimir</button></td></tr>` +
              `<tr class="ot-detail" id="otDetail${i}" style="display:none"><td colspan="9" style="padding:0;background:#FAFBFD"></td></tr>`
            );
          })
          .join("");

        content.innerHTML = `
          <div class="kpi-row">
            <div class="kpi"><div class="k-label">OT activas</div><div class="k-value">${ots.length}</div></div>
            <div class="kpi"><div class="k-label">Atrasadas</div><div class="k-value crit">${atrasadas}</div></div>
            <div class="kpi"><div class="k-label">En proceso</div><div class="k-value">${enProceso}</div></div>
            <div class="kpi"><div class="k-label">Pendientes</div><div class="k-value">${pendientes}</div></div>
          </div>
          <div class="card pad-lg">
            <div class="card-title">Órdenes de Trabajo del proyecto</div>
            <p class="muted" style="font-size:12px;margin:-4px 0 12px">Toca una fila para ver hallazgos con foto Â· <b>Imprimir</b> genera la OT en PDF</p>
            <table class="tbl mt">
              <thead><tr><th>OT</th><th>Unidad</th><th>Piso</th><th>KPI</th><th>Especialidad</th><th>Hallazgos</th><th>Asignado</th><th>Estado</th><th></th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>`;

        content.querySelectorAll(".ot-row").forEach((row) => {
          row.addEventListener("click", () => {
            const idx = row.dataset.ot;
            const det = document.getElementById("otDetail" + idx);
            if (!det) return;
            const td = det.querySelector("td");
            if (td && !td.dataset.loaded) {
              td.innerHTML = E.otHallazgosDetailHtml(window.__projectOts[idx].hallazgos);
              td.dataset.loaded = "1";
            }
            det.style.display = det.style.display === "none" ? "" : "none";
          });
        });
      } catch (err) {
        console.error(err);
        content.innerHTML = `<div class="card pad-lg"><div class="card-title">No se pudieron cargar las OT</div><p class="muted">${E.escapeHtml(String(err && err.message ? err.message : err))}</p></div>`;
      }
    })();
  </script>
</body>
</html>
