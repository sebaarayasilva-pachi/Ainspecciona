<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo Beta · Ainspecciona</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/header.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0B1220;
      color: #E5E7EB;
      min-height: 100vh;
    }
    .page { max-width: 520px; margin: 0 auto; padding: 48px 24px 80px; }
    .label { font: 700 12px/1 Inter; letter-spacing: 0.1em; color: #6B7280; text-transform: uppercase; margin-bottom: 8px; }
    .h1 { font-size: 28px; font-weight: 800; margin: 0 0 8px; color: #F8FAFC; }
    .p { font-size: 16px; font-weight: 500; color: #94a3b8; margin: 0 0 32px; line-height: 1.5; }

    .formSection {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 32px;
      margin-bottom: 24px;
    }
    .formSection h2 { margin: 0 0 24px; font-size: 18px; font-weight: 800; color: #F8FAFC; }
    .formGroup { margin-bottom: 20px; }
    .formGroup:last-child { margin-bottom: 0; }
    .formGroup label {
      display: block;
      font: 600 14px Inter;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .formGroup input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #F8FAFC;
      font-size: 16px;
      font-family: inherit;
    }
    .formGroup input::placeholder {
      color: #475569;
      font-weight: 300;
      font-style: italic;
      font-size: 14px;
    }
    .formGroup input:focus {
      outline: none;
      border-color: #7C3AED;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
    }
    .formRow { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 500px) { .formRow { grid-template-columns: 1fr; } }

    .btnDemo {
      display: block;
      width: 100%;
      padding: 18px 24px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #7C3AED 0%, #4F46E5 100%);
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      cursor: pointer;
      transition: opacity 0.2s;
      text-align: center;
      margin-top: 24px;
    }
    .btnDemo:hover { opacity: 0.95; }
    .btnDemo:disabled { opacity: 0.6; cursor: not-allowed; }

    .note { font-size: 14px; color: #64748b; margin-top: 24px; text-align: center; }
    .note.err { color: #f87171; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="nav">
      <a class="brand" href="/">
        <img src="/assets/Logo Ainspecciona.png" alt="Ainspecciona" />
      </a>
      <div class="navLinks">
        <a href="/como-funciona.html">Cómo funciona</a>
        <a href="/precios">Precios</a>
        <a href="/faq.html">FAQ</a>
        <a href="/contacto.html">Contacto</a>
      </div>
      <div class="topActions">
        <a class="btn outline" href="/">Acceso</a>
      </div>
    </div>
  </header>

  <main class="page">
    <p class="label">Prueba beta</p>
    <h1 class="h1">Iniciar inspección demo</h1>
    <p class="p">Completa tus datos y prueba el flujo completo de inspección sin pago.</p>

    <form id="demoForm">
      <section class="formSection">
        <h2>Datos de contacto</h2>
        <div class="formRow">
          <div class="formGroup">
            <label for="nombre">Nombre *</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan" required />
          </div>
          <div class="formGroup">
            <label for="apellido">Apellido *</label>
            <input type="text" id="apellido" name="apellido" placeholder="Ej: Pérez" required />
          </div>
        </div>
        <div class="formGroup">
          <label for="rut">RUT *</label>
          <input type="text" id="rut" name="rut" placeholder="Ej: 12.345.678-9" required />
        </div>
        <div class="formGroup">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" placeholder="tu@email.com" required />
        </div>
      </section>

      <button type="submit" class="btnDemo" id="btnDemo">Iniciar inspección demo</button>
      <div class="note" id="note"></div>
    </form>
  </main>

  <script>
    document.getElementById('demoForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnDemo');
      const note = document.getElementById('note');
      note.textContent = '';
      note.className = 'note';

      const body = {
        plan: 'starter',
        demo: true,
        nombre: document.getElementById('nombre').value.trim(),
        apellido: document.getElementById('apellido').value.trim(),
        rut: document.getElementById('rut').value.trim(),
        email: document.getElementById('email').value.trim()
      };

      btn.disabled = true;
      btn.textContent = 'Iniciando...';

      try {
        const res = await fetch('/api/starter/simulate-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          credentials: 'include'
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || data.error || 'Error al iniciar demo');
        if (data.redirectUrl) {
          window.location.href = data.redirectUrl;
          return;
        }
        throw new Error('No se recibió URL de redirección');
      } catch (err) {
        note.textContent = err.message || 'Error al iniciar. Intenta de nuevo.';
        note.className = 'note err';
      }
      btn.disabled = false;
      btn.textContent = 'Iniciar inspección demo';
    });
  </script>
  <script src="/assets/tracker.js" defer></script>
</body>
</html>
