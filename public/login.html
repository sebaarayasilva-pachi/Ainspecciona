<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingresar · Ainspecciona</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #0f1419;
      --bg1: #1a2332;
      --ink: #f2efe8;
      --muted: #9aa8b5;
      --accent: #2dd4a8;
      --accent-dim: rgba(45, 212, 168, 0.14);
      --line: rgba(242, 239, 232, 0.12);
      --danger: #f07178;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 480px at 8% -10%, rgba(45, 212, 168, 0.18), transparent 55%),
        radial-gradient(700px 400px at 100% 0%, rgba(56, 120, 180, 0.2), transparent 50%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 36px 32px 28px;
      background: rgba(15, 20, 25, 0.72);
      backdrop-filter: blur(12px);
    }
    .brand {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 2rem;
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }
    .sub {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px 14px;
      margin-bottom: 16px;
      background: rgba(255,255,255,0.04);
      color: var(--ink);
      font: inherit;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px 16px;
      font: inherit;
      font-weight: 700;
      background: var(--accent);
      color: #06261c;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .err {
      display: none;
      margin: 0 0 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(240, 113, 120, 0.12);
      color: var(--danger);
      font-size: 0.875rem;
    }
    .err.show { display: block; }
    .hint {
      margin: 18px 0 0;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="brand">Ainspecciona</h1>
    <p class="sub">Un acceso para tus productos. Ingresa con tu correo de plataforma.</p>
    <div id="err" class="err"></div>
    <form id="form">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" autocomplete="username" required placeholder="tú@empresa.com" />
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit" id="btn">Entrar</button>
    </form>
    <p class="hint">Demo TOC TOC: <code>plataforma@toctoc.ainspecciona.com</code> / misma clave de demos.</p>
  </main>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const next = params.get("next") || "/app";
      const form = document.getElementById("form");
      const err = document.getElementById("err");
      const btn = document.getElementById("btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        err.classList.remove("show");
        btn.disabled = true;
        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({
              email: document.getElementById("email").value,
              password: document.getElementById("password").value
            })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) {
            throw new Error(data.message || "No se pudo iniciar sesión");
          }
          if (data.token) {
            try { sessionStorage.setItem("platform_session", data.token); } catch (_) {}
          }
          try {
            localStorage.removeItem("tenant_session");
            localStorage.removeItem("tenant_id");
            sessionStorage.removeItem("entrega_session");
            sessionStorage.removeItem("postventa_session");
            sessionStorage.removeItem("inout_session");
          } catch (_) {}
          const isAdmin = !!(data.context && data.context.user && data.context.user.isPlatformAdmin);
          let dest = next.startsWith("/") ? next : "/app";
          if (isAdmin && (dest === "/app" || dest === "/")) dest = "/control";
          location.href = dest;
        } catch (ex) {
          err.textContent = ex.message || "Error";
          err.classList.add("show");
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
