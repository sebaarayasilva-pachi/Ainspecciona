<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crear contraseña · Ainspecciona</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/header.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0B1220;
      color: #E5E7EB;
      min-height: 100vh;
    }
    .page { max-width: 480px; margin: 0 auto; padding: 48px 24px 80px; }
    .h1 { font-size: 28px; font-weight: 800; margin: 0 0 8px; color: #F8FAFC; }
    .p { font-size: 16px; color: #94a3b8; margin: 0 0 32px; line-height: 1.5; }

    .formSection {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 32px;
    }
    .formSection h2 { margin: 0 0 24px; font-size: 18px; font-weight: 800; color: #F8FAFC; }
    .formGroup { margin-bottom: 20px; }
    .formGroup label {
      display: block;
      font: 600 14px Inter;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .formGroup input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #F8FAFC;
      font-size: 16px;
      font-family: inherit;
    }
    .formGroup input:focus {
      outline: none;
      border-color: #7C3AED;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
    }
    .formHint { font-size: 13px; color: #64748b; margin-top: 6px; }
    .btnCrear {
      display: block;
      width: 100%;
      padding: 18px 24px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #7C3AED 0%, #22D3EE 100%);
      color: #0A1022;
      font-weight: 800;
      font-size: 18px;
      cursor: pointer;
      margin-top: 24px;
      transition: opacity 0.2s;
    }
    .btnCrear:hover { opacity: 0.95; }
    .btnCrear:disabled { opacity: 0.6; cursor: not-allowed; }
    .note { font-size: 14px; margin-top: 16px; min-height: 20px; }
    .note.err { color: #f87171; }
    .skipLink { display: block; margin-top: 16px; color: #94a3b8; font-size: 14px; text-decoration: none; }
    .skipLink:hover { color: #e5e7eb; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="nav">
      <a class="brand" href="/"><img src="/assets/Logo Ainspecciona.png" alt="Ainspecciona" /></a>
      <div class="navLinks">
        <a href="/como-funciona.html">Cómo funciona</a>
        <a href="/precios">Precios</a>
        <a href="/faq.html">FAQ</a>
        <a href="/contacto.html">Contacto</a>
      </div>
    </div>
  </header>

  <main class="page">
    <h1 class="h1">Crear tu contraseña</h1>
    <p class="p">Configura una contraseña para acceder a tu dashboard en el futuro. Usarás tu email y esta contraseña para iniciar sesión.</p>

    <section class="formSection">
      <h2>Contraseña</h2>
      <form id="formClave">
        <div class="formGroup">
          <label for="password">Contraseña *</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required autocomplete="new-password" />
          <p class="formHint">Mínimo 8 caracteres, al menos 1 mayúscula y 1 número.</p>
        </div>
        <div class="formGroup">
          <label for="passwordConfirm">Confirmar contraseña *</label>
          <input type="password" id="passwordConfirm" name="passwordConfirm" placeholder="Repite la contraseña" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btnCrear" id="btnCrear">Crear contraseña e ir al dashboard</button>
        <div class="note" id="note"></div>
      </form>
    </section>
  </main>

  <script>
    (async function init() {
      const res = await fetch('/api/tenant/me', { credentials: 'include' });
      if (!res.ok) {
        window.location.href = '/?error=session_required';
        return;
      }
    })();

    document.getElementById('formClave').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnCrear');
      const note = document.getElementById('note');
      const pwd = document.getElementById('password').value;
      const pwdConfirm = document.getElementById('passwordConfirm').value;

      note.textContent = '';
      note.className = 'note';

      if (pwd !== pwdConfirm) {
        note.textContent = 'Las contraseñas no coinciden.';
        note.className = 'note err';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Guardando...';

      try {
        const res = await fetch('/api/business/set-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd }),
          credentials: 'include'
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.message || data.error || 'Error al guardar');
        }
        if (data.redirectUrl) {
          window.location.href = data.redirectUrl;
          return;
        }
        window.location.href = '/tenant';
      } catch (err) {
        note.textContent = err.message || 'Error. Intenta de nuevo.';
        note.className = 'note err';
      }
      btn.disabled = false;
      btn.textContent = 'Crear contraseña e ir al dashboard';
    });
  </script>
</body>
</html>
