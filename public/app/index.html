<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ainspecciona</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app/app.css" />
</head>
<body>
  <div class="nda-overlay" id="ndaOverlay" aria-modal="true" role="dialog" aria-labelledby="ndaTitle">
    <div class="nda-card">
      <header>
        <h2 id="ndaTitle">Acuerdo de Confidencialidad</h2>
        <p>Debes aceptar el NDA para continuar en este ambiente demo.</p>
      </header>
      <div class="nda-body" id="ndaBody">Cargando…</div>
      <div class="nda-foot">
        <label>
          <input type="checkbox" id="ndaCheck" />
          <span>He leído y acepto el Acuerdo de Confidencialidad.</span>
        </label>
        <p class="nda-err" id="ndaErr"></p>
        <div class="btn-row">
          <button type="button" id="ndaAccept" disabled>Aceptar y continuar</button>
        </div>
      </div>
    </div>
  </div>
  <div class="backdrop" id="backdrop" hidden></div>

  <aside class="aside" id="aside">
    <div class="aside-brand">
      <p class="name">Ainspecciona</p>
      <p class="org" id="orgLine">Cargando…</p>
    </div>

    <div class="nav-label">Plataforma</div>
    <nav class="nav" id="navMain" aria-label="Plataforma"></nav>

    <div class="nav-label">Módulos</div>
    <nav class="nav" id="navMods" aria-label="Módulos"></nav>

    <div class="aside-foot">
      <div class="user-chip" id="who">
        <strong>…</strong>
        <span></span>
      </div>
      <a class="nav-item" id="controlLink" href="/control" style="display:none">
        <span class="dot"></span> Control
      </a>
      <button class="nav-item" type="button" id="logout">
        <span class="dot"></span> Salir
      </button>
    </div>
  </aside>

  <div class="shell">
    <div class="topbar">
      <button class="menu-btn" type="button" id="menuBtn" aria-label="Abrir menú">☰</button>
      <p class="name">Ainspecciona</p>
    </div>
    <main class="content" id="content">
      <h1>Dashboard</h1>
      <p class="lead">Cargando…</p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="/app/shell.js"></script>
</body>
</html>
