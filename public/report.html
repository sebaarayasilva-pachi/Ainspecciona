<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ainspecciona – Informe</title>
  <meta name="ainspecciona-report-scoring" content="v3-admin-sync" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0B1220;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      color: #F8FAFC;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      padding: 12px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      background: #0B1220;
      border-bottom: 1px solid #1e293b;
    }
    @media (min-width: 768px) {
      .toolbar {
        padding: 16px 24px;
        gap: 12px;
        max-width: 1143px;
      }
    }
    .toolbtn {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #F8FAFC;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      min-height: 44px;
    }
    @media (min-width: 480px) {
      .toolbtn {
        min-height: unset;
      }
    }
    .toolbtn:disabled {
      opacity: 0.7;
      cursor: default;
    }
    .toolnote {
      font-size: 12px;
      color: #94a3b8;
    }
    .toolbar__right {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-left: auto;
    }
    .report-admin-toolbar {
      display: none;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .report-admin-toolbar.is-visible { display: flex; }
    .report-admin-toolbar__label {
      font-size: 12px;
      font-weight: 700;
      color: #35d07f;
      white-space: nowrap;
    }
    .toolbtn--accent {
      border-color: #35d07f;
      background: rgba(53, 208, 127, 0.12);
    }
    .toolbtn--outline {
      background: transparent;
    }
    .report-reanalyze-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #35d07f;
      cursor: pointer;
      font-family: Inter, sans-serif;
      user-select: none;
    }
    .report-reanalyze-label input {
      width: 16px;
      height: 16px;
      accent-color: #35d07f;
      cursor: pointer;
      flex-shrink: 0;
    }
    .report-reanalyze-label.is-disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .report-reanalyze-label.is-disabled input { cursor: not-allowed; }
    .canvas {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      padding: 12px 8px 32px;
      box-sizing: border-box;
    }
    @media (min-width: 768px) {
      .canvas {
        padding: 24px 16px 40px;
      }
    }
    #reportSvg {
      display: block;
      width: 100%;
      max-width: 1143px;
      height: auto;
      margin: 0 auto;
      background: #0B1220;
    }
  </style>
</head>
<body>

      <button type="button" id="reanalyzeMarkPhotos" class="toolbtn toolbtn--outline">Marcar con foto</button>
      <button type="button" id="reanalyzeClearAll" class="toolbtn toolbtn--outline">Quitar selección</button>
      <button type="button" id="reanalyzeRun" class="toolbtn toolbtn--accent">Reanalizar seleccionados</button>

    </div>

      <button id="downloadPdfBtn" class="toolbtn" type="button">Descargar PDF</button>

      <div id="loadError" class="toolnote" style="color:#dc2626;font-weight:600;display:none;"></div>
    </div>
  </div>
  <div class="canvas">
    <svg id="reportSvg" viewBox="0 0 1143 2780" preserveAspectRatio="xMidYMin meet" xmlns="http://www.w3.org/2000/svg">

        </clipPath>
        <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#0B1220"/>

        </linearGradient>
        <linearGradient id="headerAccent" x1="0" y1="0" x2="1" y2="0">

        <filter id="headerGlow" x="-50%" y="-50%" width="200%" height="200%">

        </filter>
      </defs>

      <rect id="bgRect" width="1143" height="2780" fill="#0B1220"/>

      <g clip-path="url(#headerClip)">
        <rect x="28" y="0" width="1087" height="140" fill="url(#headerGrad)"/>
        <rect x="28" y="0" width="1087" height="4" fill="url(#headerAccent)" opacity="0.9"/>
        <rect x="28" y="136" width="1087" height="4" fill="url(#headerAccent)" opacity="0.15"/>
        <image id="brandLogoTenant" href="" x="40" y="18" width="160" height="104" preserveAspectRatio="xMidYMid meet" opacity="0"/>
        <image id="brandLogoAinspecciona" href="/assets/Logo 2 ainspecciona.png" x="28" y="-16" width="238" height="172" preserveAspectRatio="xMidYMid meet"/>
        <text x="571" y="58" font-size="24" fill="#F8FAFC" font-weight="800" text-anchor="middle" font-family="Inter,sans-serif">Informe Técnico del Inmueble</text>
        <text x="571" y="82" font-size="13" fill="#94a3b8" text-anchor="middle" font-family="Inter,sans-serif">Evaluación automatizada basada en evidencia fotográfica</text>
        <rect x="980" y="36" width="120" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>
        <text x="1040" y="57" font-size="11" fill="#94a3b8" font-weight="700" text-anchor="middle">STI v3.0</text>

      <text x="826" y="208" font-size="18" fill="#F8FAFC" font-weight="700" text-anchor="middle">Score Técnico del Inmueble (STI)</text>
      <path id="stiBaseArc" d="M756 318 A70 70 0 0 1 896 318" stroke="#475569" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path id="stiArc" d="M756 318 A70 70 0 0 1 896 318" stroke="#E0B300" stroke-width="14" fill="none" stroke-linecap="round"/>
      <text id="stiScore" x="826" y="316" font-size="18" fill="#F8FAFC" font-weight="700" text-anchor="middle">—</text>

        <rect id="execSummaryCard" x="52" y="744" width="1040" height="200" rx="14" fill="#334155" filter="url(#shadowSmall)"/>
        <foreignObject id="execSummaryContent" x="80" y="764" width="984" height="150">
          <div xmlns="http://www.w3.org/1999/xhtml" id="execSummaryWrap" style="display:flex;flex-direction:column;min-height:120px;width:100%;">

      <g id="techDoc">
        <text id="techDocTitle" x="80" y="2685" font-size="14" fill="#F8FAFC" font-weight="700">Documentación técnica del análisis automatizado</text>
        <foreignObject id="techDocBody" x="80" y="2715" width="984" height="420">
          <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:11px;color:#94a3b8;line-height:1.4;font-family:Inter,sans-serif;white-space:normal;">
            El presente informe fue generado mediante un proceso automatizado ejecutado en infraestructura serverless de Google Cloud Platform (GCP), utilizando modelos avanzados de visión computacional provistos por OpenAI, en su versión vigente al momento del análisis.<br/><br/>
            Las imágenes capturadas durante el proceso guiado son sometidas a un pipeline de procesamiento estructurado que contempla:<br/><br/>
            • Normalización y preprocesamiento de imagen (formato, orientación, escala y control básico de ruido).<br/>
            • Análisis de píxel y distribución cromática, incluyendo evaluación de variaciones de intensidad, contraste y discontinuidades de color.<br/>
            • Construcción y evaluación de histogramas y segmentación regional para identificar patrones atípicos o zonas no homogéneas.<br/>
            • Detección de bordes, contornos y geometrías mediante algoritmos de edge detection para identificar indicios compatibles con fisuras, desalineaciones, golpes o deformaciones visibles.<br/>
            • Evaluación de relaciones espaciales y coherencia estructural entre elementos constructivos.<br/>
            • Clasificación semántica contextual en función del KPI técnico asignado a cada slot evaluado.<br/><br/>
            Los hallazgos detectados corresponden a indicios compatibles con condiciones técnicas observables en las imágenes, y son consolidados mediante un modelo de agregación multicriterio que pondera cantidad, distribución y severidad relativa para generar el score general del inmueble.<br/><br/>
            El análisis se basa exclusivamente en información visual capturada y no contempla mediciones físicas, pruebas destructivas ni diagnósticos estructurales invasivos. No sustituye inspecciones presenciales cuando estas sean requeridas por normativa, tasación o peritaje especializado.<br/><br/>
            Cada informe queda asociado a identificador único de caso, timestamp de ejecución y versión de modelo utilizada, permitiendo trazabilidad técnica bajo las mismas condiciones operativas.
          </div>
        </foreignObject>
      </g>

  <script>
    const svgNS = "http://www.w3.org/2000/svg";
    const GROUP_ORDER = [
      "BATH_MAIN",
      "BATH_SECONDARY",
      "KITCHEN",
      "LAUNDRY",
      "ELECTRICAL",
      "STRUCTURE",
      "EXTERIOR",
      "ATTIC",
      "OTHER",
    ];

    function sortGroups(groups) {
      const idx = new Map(GROUP_ORDER.map((k, i) => [k, i]));
      return [...groups].sort((a, b) => {
        const ia = idx.get((a.groupKey || "OTHER").toUpperCase()) ?? 999;
        const ib = idx.get((b.groupKey || "OTHER").toUpperCase()) ?? 999;
        return ia - ib;
      });
    }

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value || "—";
    }

    function formatDate(value) {
      if (!value) return "—";
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return "—";
      const parts = new Intl.DateTimeFormat("es-CL", {
        day: "2-digit",
        month: "long",
        year: "numeric",
      }).formatToParts(d);
      const day = parts.find(p => p.type === "day")?.value || "";
      const month = parts.find(p => p.type === "month")?.value || "";
      const year = parts.find(p => p.type === "year")?.value || "";
      return `${day} · ${month} · ${year}`;
    }

    function badgeColor(badge) {
      const b = String(badge || "").toUpperCase();
      if (b === "GREEN") return "#10B981";
      if (b === "YELLOW") return "#F59E0B";
      if (b === "RED") return "#F97316";
      if (b === "GRAY") return "#94A3B8";
      return "#94A3B8";
    }

    function badgeLabel(badge) {
      const b = String(badge || "").toUpperCase();
      if (b === "GREEN") return "Favorable";
      if (b === "YELLOW") return "Intermedio";
      if (b === "RED") return "Revisión sugerida";
      if (b === "GRAY") return "Sin datos";
      return "—";
    }

    function severityLabel(sev) {
      const s = String(sev || "").toLowerCase();
      if (s === "high") return { text: "HIGH", fill: "#FED7AA", bg: "#7C2D12", stroke: "#9A3412" };
      if (s === "medium") return { text: "MEDIUM", fill: "#FED7AA", bg: "#7C2D12", stroke: "#9A3412" };
      if (s === "low") return { text: "LOW", fill: "#86EFAC", bg: "#14532D", stroke: "#166534" };
      return { text: "OK", fill: "#86EFAC", bg: "#14532D", stroke: "#166534" };
    }

    function starsFromScore(score, cfg) {
      const yellowFrom = cfg?.badge?.yellowFrom ?? DEFAULT_SCORE_CONFIG.badge.yellowFrom;
      const greenFrom = cfg?.badge?.greenFrom ?? DEFAULT_SCORE_CONFIG.badge.greenFrom;
      const n = clampScore(score);
      if (n >= greenFrom) {
        const topTier = greenFrom + Math.max(1, Math.round((100 - greenFrom) * 0.33));
        return n >= topTier ? 5 : 4;
      }
      if (n >= yellowFrom) {
        const midYellow = yellowFrom + Math.round((greenFrom - yellowFrom) * 0.5);
        return n >= midYellow ? 3 : 2;
      }
      return 1;
    }

    const STAR_PATH = "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z";
    function renderStarIcons(parent, score, cx, starY, cfg) {
      const filled = starsFromScore(score, cfg);
      const starSize = 14;
      const gap = 4;
      const totalW = 5 * starSize + 4 * gap;
      const startX = cx - totalW / 2;
      for (let i = 0; i < 5; i++) {
        const g = createSvg("g", { transform: `translate(${startX + i * (starSize + gap)},${starY}) scale(${starSize / 24})` });
        const p = createSvg("path", { d: STAR_PATH, fill: i < filled ? "#F59E0B" : "#475569" });
        g.appendChild(p);
        parent.appendChild(g);
      }
    }

    function impactLabel(sev) {
      const s = String(sev || "").toLowerCase();
      if (s === "high") return "Alto";
      if (s === "medium") return "Medio";
      return "Bajo";
    }

    function arcPath(cx, cy, r, startAngle, endAngle) {
      const toRad = (deg) => (deg * Math.PI) / 180;
      const start = {
        x: cx + r * Math.cos(toRad(startAngle)),
        y: cy + r * Math.sin(toRad(startAngle)),
      };
      const end = {
        x: cx + r * Math.cos(toRad(endAngle)),
        y: cy + r * Math.sin(toRad(endAngle)),
      };
      const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
      return `M${start.x} ${start.y} A${r} ${r} 0 ${largeArc} 1 ${end.x} ${end.y}`;
    }

    function clampScore(value) {
      const num = Number(value);
      if (Number.isNaN(num)) return 0;
      return Math.max(0, Math.min(100, num));
    }

    function applyArcProgress(pathEl, percent) {
      if (!pathEl) return;
      const pct = clampScore(percent) / 100;
      const length = pathEl.getTotalLength();
      pathEl.setAttribute("stroke-dasharray", `${length * pct} ${length}`);
      pathEl.setAttribute("stroke-dashoffset", "0");
    }

    function slugifyId(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/(^-|-$)/g, "");
    }

    function getCaseIdFromPath() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      const idx = parts.indexOf('cases');
      if (idx >= 0 && parts[idx + 1]) return parts[idx + 1];
      return null;
    }

    function escapeHtml(s) {
      if (!s) return "";
      const div = document.createElement("div");
      div.textContent = s;
      return div.innerHTML;
    }

    function formatExecSummary(text) {
      if (!text || typeof text !== "string") return "";
      const escaped = escapeHtml(text);
      const blocks = escaped.split(/\n\n+/).filter(Boolean);
      return blocks.map((block) => {
        const lines = block.split(/\n/).filter(Boolean);
        const bulletLines = lines.filter((l) => /^[\-\•]\s/.test(l) || /^\d+\.\s/.test(l));
        const allBullets = bulletLines.length === lines.length && lines.length > 0;
        if (allBullets && lines.length >= 1) {
          const items = lines.map((l) => l.replace(/^[\-\•]\s?/, "").replace(/^\d+\.\s?/, ""));
          return '<ul style="margin:0.4em 0;padding-left:1.2em;">' + items.map((i) => "<li>" + i + "</li>").join("") + "</ul>";
        }
        return '<p style="margin:0.4em 0;">' + lines.join("<br/>") + "</p>";
      }).join("");
    }

    function createSvg(tag, attrs = {}) {
      const el = document.createElementNS(svgNS, tag);
      Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
      return el;
    }

    let reportAdminMode = false;
    const reportReanalyzeSelected = new Set();
    let reportReanalyzeDefaultsApplied = false;
    let lastSummarySlots = [];

    let reportAdminVerified = null;

    function getAdminHeaders() {
      const u = localStorage.getItem("ainspectaAdminUser");
      const p = localStorage.getItem("ainspectaAdminPass");
      if (!u || !p) return null;
      return { "x-admin-user": u, "x-admin-pass": p };
    }

    /**
     * Modo corrección: solo si se entra explícitamente con ?corr=1 (botón
     * "Corregir en informe" del panel admin) Y las credenciales de admin
     * guardadas son válidas en el servidor. En la vista normal del informe
     * (tenant/público) nunca se muestra la barra, aunque seas admin.
     */
    async function isReportAdminMode() {
      if (reportAdminVerified != null) return reportAdminVerified;
      const params = new URLSearchParams(window.location.search);
      const corrRequested = params.get("corr") === "1" || params.get("admin") === "1";
      if (!corrRequested) { reportAdminVerified = false; return false; }
      const headers = getAdminHeaders();
      if (!headers) { reportAdminVerified = false; return false; }
      try {
        const res = await fetch("/api/admin/score-config", { headers });
        reportAdminVerified = res.ok;
      } catch (e) {
        reportAdminVerified = false;
      }
      return reportAdminVerified;
    }

    function slotHasPhoto(s) {
      return !!(s?.photoId || s?.photoUrl);
    }

    function getSlotCode(s) {
      return String(s?.slotCode || "").trim();
    }

    function showReportAdminToolbar() {
      const bar = document.getElementById("reportAdminToolbar");
      if (bar) bar.classList.add("is-visible");
    }

    function appendSlotReanalyzeCheckbox(container, x, y, slotCode, hasPhoto) {
      if (!slotCode) return;
      const fo = createSvg("foreignObject", { x: String(x), y: String(y), width: "128", height: "26" });
      const div = document.createElement("div");
      div.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
      const checked = reportReanalyzeSelected.has(slotCode);
      const label = document.createElement("label");
      label.className = "report-reanalyze-label" + (hasPhoto ? "" : " is-disabled");
      const input = document.createElement("input");
      input.type = "checkbox";
      input.setAttribute("data-slot-code", slotCode);
      if (!hasPhoto) input.disabled = true;
      else {
        input.checked = checked;

    async function runReportReanalyze() {
      const caseId = getCaseIdFromPath();
      const btn = document.getElementById("reanalyzeRun");
      const statusEl = document.getElementById("reanalyzeStatus");
      const selected = Array.from(reportReanalyzeSelected);
      if (!caseId) return;
      if (!selected.length) {
        if (statusEl) {
          statusEl.textContent = "Marca al menos un slot con foto.";
          statusEl.style.color = "#f87171";
        }
        return;
      }
      const prev = btn ? btn.textContent : "";
      if (btn) { btn.disabled = true; btn.textContent = "Iniciando…"; }
      if (statusEl) { statusEl.textContent = ""; statusEl.style.color = "#94a3b8"; }
      const slotsParam = "&slots=" + encodeURIComponent(selected.join(","));
      try {
        const res = await fetch(`/api/cases/${encodeURIComponent(caseId)}/reanalyze?force=1${slotsParam}`, { method: "POST", headers: getAdminHeaders() || {} });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data?.ok) {
          throw new Error(data?.error || data?.message || "No se pudo iniciar el reanálisis");
        }
        const total = data.queued || 0;
        if (total === 0) throw new Error("No hay fotos para reanalizar en los slots seleccionados");
        if (btn) btn.textContent = `0/${total}…`;
        await new Promise((resolve) => {
          const intervalId = setInterval(async () => {
            try {
              const res2 = await fetch(`/api/cases/${encodeURIComponent(caseId)}/reanalyze-status`);
              const st = await res2.json().catch(() => ({}));
              if (!st.active || st.done) {
                clearInterval(intervalId);
                if (btn) { btn.disabled = false; btn.textContent = prev; }
                const errCount = st.errors || 0;
                if (statusEl) {
                  statusEl.textContent = errCount > 0
                    ? `Listo con ${errCount} error(es). Actualizando informe…`
                    : `Reanálisis completado (${total} slot${total === 1 ? "" : "s"}). Actualizando…`;
                  statusEl.style.color = errCount > 0 ? "#fbbf24" : "#35d07f";
                }
                executiveSummaryAutoTriggered = false;
                await load();
                if (reportAdminMode) {
                  await generateExecutiveSummary({ auto: true, force: true });
                }
                resolve();
              } else if (btn) {
                btn.textContent = `${st.completed || 0}/${st.total || total}…`;
              }
            } catch (e) {}
          }, 2000);
        });
      } catch (e) {
        if (statusEl) {
          statusEl.textContent = e?.message || String(e);
          statusEl.style.color = "#f87171";
        }
        if (btn) { btn.disabled = false; btn.textContent = prev; }
      }
    }

        if (!hasSlots) {
          container.appendChild(createSvg("text", { x: 150, y: currentY + slotStartOffset + 22, "font-size": 12, fill: "#64748b" }))
            .textContent = "Sin evidencia disponible en este KPI.";
        }

        let slotCursorY = currentY + slotStartOffset;
        list.forEach((s, idx) => {
          const slotY = slotCursorY;
          const isOmitted = !!s.omitted || String(s.status || "").toUpperCase() === "NOT_CAPTURABLE";
          const sev = isOmitted
            ? { text: "OMITIDA", fill: "#FDE68A", bg: "#78350F", stroke: "#92400E" }
            : severityLabel(s.severity);
          const slotPenalty = isOmitted ? 0 : (() => {
            const fromApi = Number(s.scorePenaltyApplied);
            if (Number.isFinite(fromApi) && fromApi >= 0) return fromApi;
            return slotPenaltyFromSlot(s, g.key, scoreConfig);
          })();
          const slotScore = isOmitted ? null : Math.max(0, 100 - slotPenalty);
          const sourceLabel = String(s.source || "").toUpperCase() === "OPENAI" ? "OpenAI" : "V1";
          const code = s.findingCode || s.slotCode || "";
          const humanizeFindingCodeForTag = (c) => {
            const u = String(c || "").toUpperCase();
            if (u === "SEAL_FAILURE") return "Sellos / condensación";
            if (u === "FLOOR_MOISTURE_JOINT_DAMAGE") return "Juntas / humedad en piso";
            if (u === "COSMETIC_WEAR") return "Desgaste superficial";
            return String(c || "");
          };
          let evidenceUrl = s.photoId ? `/api/photos/${s.photoId}` : (s.photoUrl || null);
          if (evidenceUrl && !evidenceUrl.startsWith('/') && evidenceUrl.startsWith('https://storage.googleapis.com/')) {
            evidenceUrl = '/api/photo-proxy?url=' + encodeURIComponent(evidenceUrl);
          }
          const hasIssue = Boolean(s.severity) && String(s.findingCode || "").toUpperCase() !== "OK";
          const sanitize = (t) => t && typeof t === "string" ? t.replace(/\bLIVING_CEILING\b/gi, "el techo del living").replace(/\bLIVING_WALLS\b/gi, "los muros").replace(/\bBATHROOM_\d+_\w+/g, (m) => m.replace(/_/g, " ").toLowerCase()).replace(/\bKITCHEN_\w+/g, (m) => m.replace(/_/g, " ").toLowerCase()) : t;
          const normalizeContextTerms = (t) => {
            let out = String(t || "");
            const context = `${String(s.groupTitle || "").toLowerCase()} ${String(s.title || "").toLowerCase()} ${String(g.title || "").toLowerCase()}`;
            const isBathroom = /(baño|bano|lavamanos|wc|ducha|tina|sanitario)/i.test(context);
            const isKitchen = /(cocina|lavaplatos|meson|mesón)/i.test(context);
            if (isBathroom) {
              out = out.replace(/\bencimera\b/gi, "superficie del lavamanos");
              out = out.replace(/\bmes[óo]n\b/gi, "superficie del lavamanos");
            } else if (!isKitchen) {
              out = out.replace(/\bencimera\b/gi, "superficie");
            }
            return out.replace(/\s+/g, " ").trim();
          };
          const softenUnsupportedLocationClaims = (text, visualDesc) => {
            let out = String(text || "");
            const desc = String(visualDesc || "").toLowerCase();
            const hasLowerEvidence = /(inferior|abajo|base|zócalo|zocalo|piso|suelo)/i.test(desc);
            const hasUpperEvidence = /(superior|arriba|techo|cielo|alto)/i.test(desc);
            if (!hasLowerEvidence) {
              out = out
                .replace(/\s+en\s+la\s+parte\s+inferior\b/gi, "")
                .replace(/\s+en\s+el\s+sector\s+inferior\b/gi, "")
                .replace(/\s+en\s+la\s+zona\s+inferior\b/gi, "");
            }
            if (!hasUpperEvidence) {
              out = out
                .replace(/\s+en\s+la\s+parte\s+superior\b/gi, "")
                .replace(/\s+en\s+el\s+sector\s+superior\b/gi, "")
                .replace(/\s+en\s+la\s+zona\s+superior\b/gi, "");
            }
            return out.replace(/\s{2,}/g, " ").trim();
          };
          const removeRetakePhrases = (txt) => {
            let out = String(txt || "").replace(/\s*[•\-]?\s*No\s+se\s+puede\s+evaluar\s+por\s+falta\s+de\s+claridad\.?\s*/gi, " ").replace(/\s*Se\s+recomienda\s+retomar\s+(la\s+)?fotograf[ií]a\.?\s*/gi, " ").replace(/\s*Se\s+sugiere\s+retomar\s+(la\s+)?foto\.?\s*/gi, " ").replace(/\s*Retomar\s+(la\s+)?fotograf[ií]a\s+recomendado\.?\s*/gi, " ").replace(/\s*,\s*lo\s+que\s+dificulta\s+(la\s+)?visibilidad\.?\s*/gi, ". ").replace(/\s{2,}/g, " ").trim();
            return out || "Las superficies se ven uniformes y sin evidencias claras de deterioro.";
          };
          const desc = normalizeContextTerms(removeRetakePhrases(sanitize(s?.analysisDebug?.openai?.parsed?.description || "")));
          const kpiAnalysis = softenUnsupportedLocationClaims(
            normalizeContextTerms(removeRetakePhrases(sanitize(s?.analysisDebug?.openai?.parsed?.kpi_analysis || ""))),
            desc
          );
          const rawSignals = (s?.analysisDebug?.openai?.parsed?.signals_detected || []).map((x) => normalizeContextTerms(sanitize(x)));
          const qualityIssueRe = /image_quality_issue|imagequalityissue|calidad\s*(de\s*)?(imagen|foto)|retomar\s*(la\s+)?foto|falta\s*de\s*claridad|imagen\s*borrosa|poca\s*iluminación/i;
          const isQualityIssueCode = (c) => !!(c && (qualityIssueRe.test(String(c)) || String(c).toLowerCase().includes('image_quality')));
          const signals = rawSignals.filter((sig) => !qualityIssueRe.test(String(sig || "")) && !String(sig || "").toLowerCase().includes('image_quality'));
          const clampLen = (text, max = 280) => {
            const str = String(text || "").trim();
            return str.length > max ? str.slice(0, max) + "…" : str;
          };
          const wrapLines = (text, maxLen = 90, maxLines = 10) => {
            const s = String(text || "").trim();
            if (!s) return [];
            if (s.length <= maxLen) return [s];
            const lines = [];
            let rest = s;
            while (rest.length > 0 && lines.length < maxLines) {
              if (rest.length <= maxLen) { lines.push(rest); break; }
              const chunk = rest.slice(0, maxLen);
              const lastSpace = chunk.lastIndexOf(" ");
              const breakAt = lastSpace > maxLen * 0.4 ? lastSpace : maxLen;
              lines.push(rest.slice(0, breakAt).trim());
              rest = rest.slice(breakAt).trim();
            }
            return lines;
          };
          const hasOpenAiDescription = Boolean(String(s?.analysisDebug?.openai?.parsed?.description || "").trim());
          const toNeutralVisualDescription = (text, areaLabel) => {
            const base = String(text || "").trim();
            if (!base) return `Registro visual del área inspeccionada: ${areaLabel || "sector evaluado"}.`;
            const pieces = base
              .split(/(?<=[\.\!\?])\s+/)
              .map((p) => p.trim())
              .filter(Boolean);
            const nonDiagnostic = pieces.filter((p) => {
              const t = p.toLowerCase();
              if (!t) return false;
              // Mantener "Descripción" neutral: solo lo visible, sin conclusión/diagnóstico.
              if (/(conclusi[oó]n|hallazgo|diagn[oó]stic|severidad|criticidad|riesgo|impacto|puntaje|score|kpi|recomendaci[oó]n)/i.test(t)) return false;
              if (/(filtraci[oó]n|fuga|humedad|moho|grieta|fisura|corrosi[oó]n|da[ñn]o|deterioro|anomal[ií]a|desprendimiento)/i.test(t)) return false;
              if (/(requiere|debe|sugiere|se recomienda|se concluye|evidencia|compatible con)/i.test(t)) return false;
              return true;
            });
            const merged = nonDiagnostic.join(" ").replace(/\s{2,}/g, " ").trim();
            return merged || `Registro visual del área inspeccionada: ${areaLabel || "sector evaluado"}.`;
          };
          const neutralDescription = isOmitted ? "" : toNeutralVisualDescription(desc, s.title || s.slotCode || "sector evaluado");
          const descLines = wrapLines(neutralDescription, 110, 8);
          const kpiTitle = g.title || kpiLabel(g.key);
          const headerText = `${s.groupTitle || "Área"} · ${s.title || s.slotCode || ""}`;
          const subHeaderText = isOmitted

          const rightRailX = 72 + 1000 - 100;
          const rightRailCx = rightRailX + 42;

          // Card contenedor (slot - más oscuro y sutil que la card KPI)
          const slotCard = createSvg("rect", { x: 72, y: slotY, width: 1000, height: slotMinH, rx: 12, fill: "#0f172a", filter: "url(#slotShadow)" });

          if (evidenceUrl) {

            const txt = createSvg("text", { x: 132, y: slotY + 128, "text-anchor": "middle", fill: "#60A5FA", "font-size": 12, "font-weight": 600 });

            container.appendChild(link);

          container.appendChild(createSvg("text", { x: 196, y: slotY + 72, fill: "#94a3b8", "font-size": 13, "font-weight": 600 })).textContent = subHeaderText;
          container.appendChild(createSvg("line", { x1: 196, y1: slotY + 86, x2: rightRailX - 24, y2: slotY + 86, stroke: "#475569" }));

          // Impacto en score (siempre coherente con el puntaje del slot: 95 = 100 - 5 → impacto −5)
          const impactStr = slotPenalty > 0 ? `−${slotPenalty} puntos` : "0 puntos";

          container.appendChild(createSvg("text", { x: 196, y: slotY + 108, fill: "#F8FAFC", "font-size": 12, "font-weight": 700 })).textContent = "Impacto en score: ";
          container.appendChild(createSvg("text", { x: 318, y: slotY + 108, fill: "#F8FAFC", "font-size": 12, "font-weight": 800 })).textContent = impactStr;
          container.appendChild(createSvg("text", { x: 400, y: slotY + 108, fill: "#94a3b8", "font-size": 12 })).textContent = impactSuffix;

          // Descripción (varias líneas) - omitidos sin texto
          let contentY = slotY + 132;
          if (!isOmitted) {
            container.appendChild(createSvg("text", { x: 196, y: contentY, fill: "#F8FAFC", "font-size": 12, "font-weight": 700 })).textContent = "Descripción";
            contentY += 20;
            descLines.forEach((line, li) => {

            if (!hasOpenAiDescription) {
              container.appendChild(createSvg("text", { x: 196, y: contentY + 4, fill: "#64748b", "font-size": 11, "font-style": "italic" })).textContent = reportAdminMode
                ? "Análisis por IA no disponible para este slot. Marca «Reanalizar» arriba a la izquierda del slot."
                : "Análisis por IA no disponible para este slot.";
              contentY += 18;
            }
            contentY += 12;
          } else {
            container.appendChild(createSvg("text", { x: 196, y: contentY, fill: "#F8FAFC", "font-size": 12, "font-weight": 700 })).textContent = "Descripción";
            contentY += 20;
            container.appendChild(createSvg("text", { x: 196, y: contentY, fill: "#94a3b8", "font-size": 12 })).textContent = "Foto omitida por el usuario.";
            contentY += 22;
          }

          // Hallazgos: omitidos sin texto
          if (!isOmitted) {
            container.appendChild(createSvg("text", { x: 196, y: contentY, fill: "#F8FAFC", "font-size": 12, "font-weight": 700 })).textContent = "Hallazgos";
            contentY += 18;
          }
          const cleanConclusionStyle = (t) => {
            let out = String(t || "");
            out = out
              .replace(/\blocalizad[oa]s?\b/gi, "puntual")
              .replace(/\bafectaci[oó]n\b/gi, "condición")
              .replace(/\bconclusi[oó]n\s*t[eé]cnica\b/gi, "Conclusión")
              .replace(/\bse\s+clasifica\s+como\s+['"]?puntual['"]?\s+en\s+t[eé]rminos\s+de\s+mantenimiento/gi, "presenta una condición puntual de mantenimiento")
              .replace(/\s{2,}/g, " ")
              .trim();

          };
          const parsedAi = s.analysisDebug?.openai?.parsed;
          const isSlotMismatchNoPenalty =
            parsedAi && parsedAi.matches_slot === false && !s.severity;
          const isOkState = isOmitted || String(s.findingCode || "").toUpperCase() === "OK" || !s.severity;
          const hallazgoMain = isOmitted
            ? ""
            : isSlotMismatchNoPenalty
              ? cleanConclusionStyle(removeRetakePhrases(s.message || kpiAnalysis || desc || "Sin observaciones."))
              : isOkState
                ? "Conclusión: no se observan hallazgos relevantes en esta evidencia."
                : cleanConclusionStyle(removeRetakePhrases(kpiAnalysis || s.message || desc || "Sin observaciones."));
          const rawFindings = Array.isArray(signals) && signals.length > 0
            ? signals.slice(0, 5).map((sig) => String(sig).trim()).filter(Boolean)
            : [];
          const stripTechnicalNames = (t) => {
            let out = String(t || "").trim();
            out = out
              .replace(/\bpalmeta_o_ceramica_quebrada\b/gi, "palmeta o cerámica quebrada")
              .replace(/\bintervencion_no_estandar_enchufe\b/gi, "intervención no estándar en enchufe/placa")
              .replace(/\bintervencion_no_estandar_cañeria\b/gi, "intervención no estándar en cañería o llave de paso")
              .replace(/\bfiltracion_activa_base_llave\b/gi, "filtración activa en base de la llave")
              .replace(/\bdescuadre_de_puerta\b/gi, "descuadre de puerta")
              .replace(/\bsello_silicona_deteriorado\b/gi, "sello de silicona deteriorado");
            out = out.replace(/^[A-Z][A-Z0-9_]*\s*[-–:]\s*/, "").trim();

          };

    function mergeScoreConfig(base, extra) {
      if (!extra || !extra.kpis) return base;
      return {
        ...base,
        ...extra,
        kpis: { ...(base.kpis || {}), ...(extra.kpis || {}) },
        badge: { ...(base.badge || {}), ...(extra.badge || {}) },
        kpiWeights: { ...(base.kpiWeights || {}), ...(extra.kpiWeights || {}) },
        messages: { ...(base.messages || {}), ...(extra.messages || {}) },
        recommendations: { ...(base.recommendations || {}), ...(extra.recommendations || {}) }
      };
    }

    /** Config de scoring: inyectada en HTML (admin) → summary → /api/public/score-config. */
    async function resolveScoreConfig(summary) {
      if (window.__AINSPECTA_SCORE_CONFIG__?.kpis) {
        return mergeScoreConfig(DEFAULT_SCORE_CONFIG, window.__AINSPECTA_SCORE_CONFIG__);
      }
      if (summary?.scoreConfig?.kpis) {
        return mergeScoreConfig(DEFAULT_SCORE_CONFIG, summary.scoreConfig);
      }
      try {
        const res = await fetch("/api/public/score-config");
        const data = await res.json();
        if (res.ok && data?.config?.kpis) {
          return mergeScoreConfig(DEFAULT_SCORE_CONFIG, data.config);
        }
      } catch (_) {}
      return DEFAULT_SCORE_CONFIG;
    }

    function slotPenaltyFromSlot(s, kpiKey, scoreConfig) {
      const fromApi = Number(s?.scorePenaltyApplied);
      if (Number.isFinite(fromApi) && fromApi >= 0) return fromApi;
      const kpiCfg = scoreConfig?.kpis?.[kpiKey] || DEFAULT_SCORE_CONFIG.kpis[kpiKey] || {};
      const sevKey = String(s.severity || "").toLowerCase();
      if (sevKey === "high") return Number(kpiCfg.high ?? 0);
      if (sevKey === "medium") return Number(kpiCfg.medium ?? 0);
      if (sevKey === "low") return Number(kpiCfg.low ?? 0);
      return 0;
    }

    function baseMessageFor(slot, cfg) {
      const kpi = String(slot.kpiKey || classifyKpi(slot) || "").toUpperCase();
      const sev = String(slot.severity || "").toLowerCase();
      const base = cfg?.messages?.[kpi]?.[sev] || DEFAULT_SCORE_CONFIG.messages?.[kpi]?.[sev];
      return base || "Se observa una condición visible asociada a este KPI en el área inspeccionada.";
    }

    }

    function aiContextFrom(slot) {
      const desc = String(slot?.analysisDebug?.openai?.parsed?.description || "").trim();
      const msg = String(slot.message || "").trim();
      const candidate = desc || msg;
      if (!candidate) return "";
      if (candidate.length > 240) return "";
      const banned = [
        "filtración", "capilaridad", "estructura", "peligroso", "urgente",
        "costo", "presupuesto", "reparación inmediata", "reparacion inmediata",
        "reparar", "debe repararse"
      ];
      const lower = candidate.toLowerCase();
      if (banned.some((w) => lower.includes(w))) return "";
      return candidate;
    }

    function classifyKpi(slot, cfg) {
      const rawCode = String(slot.slotCode || "");
      const codeUpper = rawCode.toUpperCase();
      let mapKey = String(cfg?.slotKpiMap?.[codeUpper] || cfg?.slotKpiMap?.[rawCode] || "").toUpperCase();
      if (!mapKey && cfg?.slotKpiMap) {
        const bathMatch = codeUpper.match(/^BATHROOM_\d+_(.+)$/);
        if (bathMatch) {
          const suffix = bathMatch[1];
          mapKey = String(
            cfg.slotKpiMap[`BATHROOM_1_${suffix}`]
            || cfg.slotKpiMap[`BATHROOM_2_${suffix}`]
            || ""
          ).toUpperCase();
        }
      }
      if (mapKey) return mapKey;

      const code = rawCode.toLowerCase();
      const title = String(slot.title || "").toLowerCase();
      const msg = String(slot.message || "").toLowerCase();

      const has = (txt) => title.includes(txt) || code.includes(txt);
      const hasAny = (arr) => arr.some(has);

      if (msg && ["humedad", "moho", "filtr", "water", "mold"].some((w) => msg.includes(w))) return "HUMEDAD";
      if (hasAny(["muros", "pintura", "pared", "cielo", "paint"])) return "MUROS_PINTURA";
      if (hasAny(["piso", "pisos", "floor"])) return "PISOS";
      if (code.includes("_outlets") || code.includes("_switches") || hasAny(["electrical", "tablero", "enchufe", "interruptor"])) return "ELECTRICIDAD";
      if (hasAny(["wc", "lavamanos", "lavaplatos", "grifer", "ducha", "tina", "sanitario", "sifon", "cañer", "baño", "baño"])) return "SANITARIOS";
      if (hasAny(["ventana", "vidrio", "marco", "cerramiento"])) return "VENTANAS_CERRAMIENTOS";
      if (hasAny(["puerta", "cerradura", "bisagra", "manilla", "herraje"])) return "PUERTAS_HERRAJES";
      if (hasAny(["mueble", "mobiliario", "closet", "clóset", "clósets", "gabinete", "cajon", "alacena"])) return "MOBILIARIO_FIJO";
      return null;
    }

    function kpiLabel(key) {
      const map = {
        MUROS_PINTURA: "Muros y pintura",
        HUMEDAD: "Humedad visible",
        PISOS: "Pisos",
        SANITARIOS: "Sanitarios",
        ELECTRICIDAD: "Electricidad visible",
        VENTANAS_CERRAMIENTOS: "Ventanas y cerramientos",
        PUERTAS_HERRAJES: "Puertas y herrajes",
        MOBILIARIO_FIJO: "Mobiliario fijo"
      };
      return map[key] || key[0] + key.slice(1).toLowerCase();
    }

    function kpiBadgeFromScore(score, cfg) {
      const yellowFrom = cfg?.badge?.yellowFrom ?? DEFAULT_SCORE_CONFIG.badge.yellowFrom;
      const greenFrom = cfg?.badge?.greenFrom ?? DEFAULT_SCORE_CONFIG.badge.greenFrom;
      if (score == null) return "GRAY";
      if (score >= greenFrom) return "GREEN";
      if (score >= yellowFrom) return "YELLOW";
      return "RED";
    }

    function buildKpis(slots, cfg) {
      const order = [
        "MUROS_PINTURA",
        "HUMEDAD",
        "PISOS",
        "SANITARIOS",
        "ELECTRICIDAD",
        "VENTANAS_CERRAMIENTOS",
        "PUERTAS_HERRAJES",
        "MOBILIARIO_FIJO"
      ];
      const buckets = new Map(order.map((k) => [k, []]));

      slots.forEach((s) => {
        const key = classifyKpi(s, cfg);
        if (key && buckets.has(key)) buckets.get(key).push(s);
      });

      return order.map((key) => {
        const items = buckets.get(key) || [];
        if (!items.length) {
          return { key, title: kpiLabel(key), score: null, badge: "GRAY" };
        }
        const penalties = items.map((s) => slotPenaltyFromSlot(s, key, cfg));
        const avgPenalty = penalties.length
          ? penalties.reduce((a, b) => a + b, 0) / penalties.length
          : 0;
        const inverted = Math.max(0, Math.min(100, Math.round(100 - avgPenalty)));
        return { key, title: kpiLabel(key), score: inverted, badge: kpiBadgeFromScore(inverted, cfg) };
      });
    }

    async function load() {
      const caseId = getCaseIdFromPath();
      const errEl = document.getElementById("loadError");
      if (errEl) errEl.style.display = "none";
      if (!caseId) {
        showLoadError("URL inválida: falta el número de caso. Accede desde el dashboard o ingresa una URL como /cases/XXX/report.", "No se pudo cargar el informe. La URL debe incluir el número de caso (ej: /cases/HV8BLF2U/report).");
        return;
      }

      const tenantId = getTenantIdFromQuery();
      const url = `/api/cases/${encodeURIComponent(caseId)}/summary${tenantId ? "?tenantId=" + encodeURIComponent(tenantId) : ""}`;
      let summaryRes;
      try {
        summaryRes = await fetch(url);
      } catch (err) {
        showLoadError("Error de conexión. Verifica que el servidor esté corriendo.", "No se pudo conectar al servidor. Asegúrate de que el servidor esté levantado (npm run dev) y que la URL sea correcta.");
        console.error("Report fetch error:", err);
        return;
      }
      const summary = await summaryRes.json().catch(() => ({}));
      if (!summaryRes.ok || !summary.ok) {
        const msg = summary?.error === "CASE_NOT_FOUND" ? "Caso no encontrado." : "Error al cargar el informe. Intenta recargar.";
        const detail = summaryRes.status === 500 && summary?.message ? " " + String(summary.message).slice(0, 120) : "";
        showLoadError(msg + detail, (summary?.error === "CASE_NOT_FOUND" ? "El caso no existe o el ID es incorrecto. " : "") + "Intenta recargar o verifica el número de caso.");
        console.error("Report load error:", summaryRes.status, summary);
        return;
      }

      const c = summary.case || {};
      if (c.shortId && caseId.length > 8) {
        const newPath = `/cases/${c.shortId}/report`;
        if (window.location.pathname !== newPath) history.replaceState(null, '', newPath);
      }
      const property = c.property || {};
      const owner = property.owner || {};

      applyReportBrandLogos(summary.tenant || null);

      setText("propertyAddress", property.address);
      setText("propertyRol", property.rol);
      const op = String(property.operationType || "").toUpperCase() === "ARRENDO" ? "ARRIENDO" : property.operationType;
      setText("propertyOperation", op);
      setText("propertySurface", property.surface);
      setText("caseNumber", c.shortId || caseId);
      setText("analysisDate", formatDate(c.createdAt));
      setText("headerDate", formatDate(c.createdAt));

      const scoreConfig = await resolveScoreConfig(summary);
      const score = clampScore(summary.score);
      setText("stiScore", `${Math.round(score)} / 100`);
      setText("stiLabel", badgeLabel(summary.badge));
      const stiArcEl = document.getElementById("stiArc");
      const stiLabelEl = document.getElementById("stiLabel");
      if (stiArcEl) stiArcEl.setAttribute("stroke", badgeColor(summary.badge));
      if (stiLabelEl) stiLabelEl.setAttribute("fill", badgeColor(summary.badge));
      const fullArc = arcPath(826, 318, 70, 180, 0);
      const stiBaseArc = document.getElementById("stiBaseArc");
      const stiArc = document.getElementById("stiArc");
      if (stiBaseArc) stiBaseArc.setAttribute("d", fullArc);
      if (stiArc) stiArc.setAttribute("d", fullArc);
      applyArcProgress(stiArc, score);
      const stiStars = document.getElementById("stiStars");
      if (stiStars) {
        stiStars.innerHTML = "";
        renderStarIcons(stiStars, score, 826, 328, scoreConfig);
      }

      const slots = summary.slots || [];
      lastSummarySlots = slots;
      reportAdminMode = await isReportAdminMode();
      if (reportAdminMode) {
        showReportAdminToolbar();
        if (!reportReanalyzeDefaultsApplied) {
          slots.forEach((s) => {
            const code = getSlotCode(s);
            if (code && slotHasPhoto(s) && !s.omitted) reportReanalyzeSelected.add(code);
          });
          reportReanalyzeDefaultsApplied = true;
        }
      }
      const kpiOrder = [
        "MUROS_PINTURA",
        "HUMEDAD",
        "PISOS",
        "SANITARIOS",
        "ELECTRICIDAD",
        "VENTANAS_CERRAMIENTOS",
        "PUERTAS_HERRAJES",
        "MOBILIARIO_FIJO"
      ];
      const fallbackKpis = buildKpis(slots, scoreConfig);
      const backendByGroup = Array.isArray(summary.byGroup) ? summary.byGroup : [];
      const backendMap = new Map(backendByGroup.map((g) => [String(g.groupKey || "").toUpperCase(), g]));
      const kpis = kpiOrder.map((key) => {
        const b = backendMap.get(key);
        if (b && b.scoreIfOnlyGroup != null) {
          const scoreValue = Number(b.scoreIfOnlyGroup);
          return { key, title: kpiLabel(key), score: scoreValue, badge: kpiBadgeFromScore(scoreValue, scoreConfig) };
        }
        return fallbackKpis.find((x) => x.key === key) || { key, title: kpiLabel(key), score: null, badge: "GRAY" };
      });
      renderKpiSummary(kpis);

      const execSummary = String(summary.case?.executiveSummary || '').trim();
      const execSummaryText = document.getElementById("execSummaryText");
      const execSummaryPlaceholder = document.getElementById("execSummaryPlaceholder");
      const execSummaryFooter = document.getElementById("execSummaryFooter");
      const stiScore = Math.round(clampScore(summary.score ?? 0));
      const execStale = execSummary && isExecutiveSummaryStale(execSummary, stiScore);
      if (execSummaryText) {
        if (execSummaryPlaceholder) execSummaryPlaceholder.remove();
        if (execSummary && !execStale) {
          execSummaryText.innerHTML = formatExecSummary(execSummary);
          execSummaryText.style.color = "#94a3b8";
          if (execSummaryFooter) execSummaryFooter.style.display = "";
        } else {
          execSummaryText.innerHTML = execStale
            ? "El resumen no coincide con el puntaje actual. Regenerando..."
            : "No hay resumen ejecutivo. Generando automáticamente...";
          execSummaryText.style.color = "#64748b";
          if (execSummaryFooter) execSummaryFooter.style.display = "none";
          if (!executiveSummaryAutoTriggered) {
            executiveSummaryAutoTriggered = true;
            generateExecutiveSummary({ auto: true, force: !!execStale }).catch(() => {});
          }
        }
      }

      const kpiGroups = kpiOrder.map((key) => {
        const items = slots.filter((s) => classifyKpi(s, scoreConfig) === key);
        const scoreValue = kpis.find((k) => k.key === key)?.score ?? null;
        const badge = kpiBadgeFromScore(scoreValue, scoreConfig);
        return {
          key,
          title: kpiLabel(key),
          scoreIfOnlyGroup: scoreValue ?? 0,
          badge,
          items
        };
      });
      lastKpiGroups = kpiGroups;
      lastScoreConfig = scoreConfig;

      adjustExecutiveSummaryLayout();
      renderKpiSections(kpiGroups, scoreConfig);
    }

    let executiveSummaryAutoTriggered = false;
    let lastKpiGroups = [];
    let lastScoreConfig = null;

    function extractStiMentionedInExecutiveSummary(text) {
      const t = String(text || "");
      const patterns = [
        /(?:score|puntaje|sti)[^\d]{0,40}(\d{1,3})\s*(?:\/\s*100|sobre\s*100)/i,
        /(\d{1,3})\s*\/\s*100/,
        /(\d{1,3})\s+sobre\s+100/i
      ];
      for (let i = 0; i < patterns.length; i++) {
        const m = t.match(patterns[i]);
        if (m) {
          const n = Number(m[1]);
          if (Number.isFinite(n) && n >= 0 && n <= 100) return Math.round(n);
        }
      }
      return null;
    }

    function isExecutiveSummaryStale(text, currentScore) {
      const mentioned = extractStiMentionedInExecutiveSummary(text);
      if (mentioned == null) return false;
      return mentioned !== Math.round(clampScore(currentScore));
    }

    async function generateExecutiveSummary({ auto = false, force = false } = {}) {
      const caseId = getCaseIdFromPath();
      if (!caseId) return;
      const execSummaryText = document.getElementById("execSummaryText");
      if (auto && execSummaryText) {
        execSummaryText.style.color = "#64748b";
        execSummaryText.innerHTML = "Generando resumen ejecutivo automáticamente...";
      }
      const tenantId = getTenantIdFromQuery();
      const qs = new URLSearchParams();
      if (tenantId) qs.set("tenantId", tenantId);
      if (force) qs.set("force", "1");
      const q = qs.toString();
      const url = `/api/cases/${encodeURIComponent(caseId)}/executive-summary${q ? "?" + q : ""}`;
      try {
        const res = await fetch(url, { method: "POST", headers: (force && getAdminHeaders()) || {} });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data?.ok && data?.executiveSummary) {
          const execSummaryFooter = document.getElementById("execSummaryFooter");
          if (execSummaryText) {
            execSummaryText.innerHTML = formatExecSummary(data.executiveSummary);
            execSummaryText.style.color = "#94a3b8";
          }
          if (execSummaryFooter) execSummaryFooter.style.display = "";
          adjustExecutiveSummaryLayout();
          if (lastKpiGroups.length && lastScoreConfig) renderKpiSections(lastKpiGroups, lastScoreConfig);
        } else {
          const errHint = data?.message
            || (data?.error === 'OPENAI_NOT_CONFIGURED' ? 'OpenAI no está configurado en el servidor (OPENAI_API_KEY).'
              : data?.error === 'OPENAI_QUOTA_EXCEEDED' ? 'Cuota de OpenAI agotada. Revisa billing en platform.openai.com.'
              : (data?.message || data?.error || 'Error desconocido'));
          if (auto && execSummaryText) {
            execSummaryText.innerHTML = `No fue posible generar el resumen ejecutivo. ${errHint}`;
            execSummaryText.style.color = "#64748b";
          }
        }
      } catch (err) {
        if (auto && execSummaryText) {
          execSummaryText.innerHTML = "No fue posible generar el resumen ejecutivo. Error de conexión.";
          execSummaryText.style.color = "#64748b";
        }
      }
    }

    load().catch(() => {});

    document.getElementById("reanalyzeMarkPhotos")?.addEventListener("click", () => {
      lastSummarySlots.forEach((s) => {
        const code = getSlotCode(s);
        if (code && slotHasPhoto(s) && !s.omitted) reportReanalyzeSelected.add(code);
      });
      refreshReportSlotCheckboxes();
      const statusEl = document.getElementById("reanalyzeStatus");
      if (statusEl) { statusEl.textContent = ""; statusEl.style.color = "#94a3b8"; }
    });
    document.getElementById("reanalyzeClearAll")?.addEventListener("click", () => {
      reportReanalyzeSelected.clear();
      refreshReportSlotCheckboxes();
      const statusEl = document.getElementById("reanalyzeStatus");
      if (statusEl) { statusEl.textContent = ""; statusEl.style.color = "#94a3b8"; }
    });
    document.getElementById("reanalyzeRun")?.addEventListener("click", () => {
      void runReportReanalyze();
    });
    document.getElementById("regenExecSummary")?.addEventListener("click", () => {
      const btn = document.getElementById("regenExecSummary");
      if (!btn) return;
      btn.disabled = true;
      const prev = btn.textContent;
      btn.textContent = "Generando…";
      generateExecutiveSummary({ auto: false, force: true }).finally(() => {
        btn.disabled = false;
        btn.textContent = prev;
      });
    });

    const pdfBtn = document.getElementById("downloadPdfBtn");
    if (pdfBtn) {
      pdfBtn.addEventListener("click", async () => {
        const caseId = getCaseIdFromPath();
        if (!caseId) return;
        pdfBtn.disabled = true;
        pdfBtn.textContent = "Generando PDF...";
        try {
          const res = await fetch(`/api/cases/${encodeURIComponent(caseId)}/report.pdf`);
          if (!res.ok) throw new Error("Error al generar el PDF");
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `Informe-${caseId}.pdf`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (err) {
          console.error(err);
          if (pdfBtn) pdfBtn.textContent = "Error. Reintentar";
        } finally {
          pdfBtn.disabled = false;
          pdfBtn.textContent = "Descargar PDF";
        }
      });
    }

    // --- Estado de revisión (solo lectura; aprobar desde panel admin) ---
    const reviewBadge = document.getElementById("reviewBadge");

    async function checkReviewStatus() {
      const caseId = getCaseIdFromPath();
      if (!caseId) return;
      try {
        const res = await fetch(`/api/cases/${encodeURIComponent(caseId)}/review-status`);
        const data = await res.json().catch(() => ({}));
        if (!data.ok) return;
        if (data.reviewStatus === "approved") {
          if (reviewBadge) {
            reviewBadge.style.display = "";
            reviewBadge.style.color = "#22c55e";
            reviewBadge.innerHTML = `&#10003; Informe aprobado`;
          }
        } else if (data.reviewStatus === "pending_review") {
          if (reviewBadge) {
            reviewBadge.style.display = "";
            reviewBadge.style.color = "#f59e0b";
            reviewBadge.textContent = "Pendiente de aprobación (usa el panel admin para aprobar)";
          }
        }
      } catch (e) {}
    }

    checkReviewStatus().catch(() => {});
  </script>
