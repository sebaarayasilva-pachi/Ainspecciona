<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Guía de Captura 3D (Estilo Huella)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
      color: white;
    }
    #video-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none; /* Dejar que los toques pasen si es necesario */
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      box-sizing: border-box;
      pointer-events: none;
    }
    .panel {
      background: rgba(0, 0, 0, 0.6);
      padding: 15px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
      pointer-events: auto;
      text-align: center;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .progress-bar {
      width: 100%;
      height: 10px;
      background: #333;
      border-radius: 5px;
      margin-top: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #4CAF50;
      width: 0%;
      transition: width 0.2s;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50%;
      z-index: 3;
    }
  </style>
  <!-- Three.js para la esfera de progreso -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Cámara de fondo -->
  <video id="video-bg" autoplay playsinline muted></video>
  
  <!-- Esfera 3D superpuesta -->
  <div id="canvas-container"></div>
  
  <!-- Mira central -->
  <div id="crosshair"></div>

  <!-- Interfaz -->
  <div id="ui-layer">
    <div class="panel" id="start-panel">
      <h2>Escaneo 3D</h2>
      <p>Para construir el espacio, pinta toda la esfera a tu alrededor (incluyendo piso y techo).</p>
      <button id="btn-start">Iniciar Cámara y Sensores</button>
    </div>
    
    <div class="panel" id="progress-panel" style="display: none;">
      <h3 style="margin: 0 0 10px 0;">Progreso de Captura</h3>
      <div id="status-text">Mueve el teléfono para pintar el entorno...</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  </div>

  <script>
    let scene, camera, renderer, sphere;
    let paintedFaces = new Set();
    let totalFaces = 0;
    
    // Variables de orientación
    let currentAlpha = 0, currentBeta = 0, currentGamma = 0;

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment' } 
        });
        document.getElementById('video-bg').srcObject = stream;
      } catch (err) {
        console.error("Error accediendo a la cámara", err);
        alert("No se pudo acceder a la cámara.");
      }
    }

    function initThree() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      
      // Cámara Three.js alineada con la pantalla
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0.1); // En el centro de la esfera

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      // Crear una esfera (Icosaedro para caras uniformes)
      // Radio 5, detalle 2 (bastantes caras para "pintar")
      const geometry = new THREE.IcosahedronGeometry(5, 2);
      totalFaces = geometry.faces ? geometry.faces.length : (geometry.attributes.position.count / 3);
      
      // Material de alambre semi-transparente
      const material = new THREE.MeshBasicMaterial({ 
        color: 0xffffff, 
        wireframe: true,
        transparent: true,
        opacity: 0.3
      });

      // Para poder pintar caras individuales, necesitamos usar colores por vértice o caras
      // En BufferGeometry moderno, usamos vertexColors
      const colors = [];
      for (let i = 0; i < geometry.attributes.position.count; i++) {
        colors.push(1, 1, 1); // Blanco inicial
      }
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      
      const paintedMaterial = new THREE.MeshBasicMaterial({
        vertexColors: true,
        wireframe: true,
        transparent: true,
        opacity: 0.8
      });

      sphere = new THREE.Mesh(geometry, paintedMaterial);
      scene.add(sphere);

      window.addEventListener('resize', onWindowResize, false);
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function requestOrientationPermission() {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
            } else {
              alert("Permiso de sensores denegado.");
            }
          })
          .catch(console.error);
      } else {
        // Dispositivos sin necesidad de pedir permiso explícito (Android)
        window.addEventListener('deviceorientation', handleOrientation);
      }
    }

    function handleOrientation(event) {
      // alpha: rotación Z (0 a 360) - brújula
      // beta: rotación X (-180 a 180) - inclinación adelante/atrás (piso/techo)
      // gamma: rotación Y (-90 a 90) - inclinación izquierda/derecha
      
      if (event.alpha === null) return; // No hay sensor

      // Convertir a radianes
      const alpha = THREE.MathUtils.degToRad(event.alpha);
      const beta = THREE.MathUtils.degToRad(event.beta);
      const gamma = THREE.MathUtils.degToRad(event.gamma);

      // Actualizar rotación de la cámara usando Quaternion para evitar Gimbal Lock
      const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
      camera.quaternion.setFromEuler(euler);
      
      paintCurrentView();
    }

    function paintCurrentView() {
      // Lanzar un rayo desde el centro de la cámara hacia adelante
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

      const intersects = raycaster.intersectObject(sphere);
      if (intersects.length > 0) {
        const faceIndex = intersects[0].faceIndex;
        if (!paintedFaces.has(faceIndex)) {
          paintedFaces.add(faceIndex);
          
          // Pintar de verde los 3 vértices de esta cara
          const colors = sphere.geometry.attributes.color;
          colors.setXYZ(faceIndex * 3, 0, 1, 0);
          colors.setXYZ(faceIndex * 3 + 1, 0, 1, 0);
          colors.setXYZ(faceIndex * 3 + 2, 0, 1, 0);
          colors.needsUpdate = true;

          updateProgress();
        }
      }
    }

    function updateProgress() {
      const percentage = (paintedFaces.size / totalFaces) * 100;
      document.getElementById('progress-fill').style.width = percentage + '%';
      
      if (percentage > 90) {
        document.getElementById('status-text').innerText = "¡Excelente! Entorno capturado.";
        document.getElementById('status-text').style.color = "#4CAF50";
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    document.getElementById('btn-start').addEventListener('click', () => {
      document.getElementById('start-panel').style.display = 'none';
      document.getElementById('progress-panel').style.display = 'block';
      initCamera();
      initThree();
      requestOrientationPermission();
    });
  </script>
</body>
</html>
