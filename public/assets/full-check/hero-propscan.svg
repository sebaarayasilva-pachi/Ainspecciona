<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="900" fill="#FFFFFF"/>

  <!-- Background subtle grid -->
  <g opacity="0.06">
    <line x1="120" y1="0" x2="120" y2="900" stroke="#0B0B0B"/>
    <line x1="232" y1="0" x2="232" y2="900" stroke="#0B0B0B"/>
    <line x1="344" y1="0" x2="344" y2="900" stroke="#0B0B0B"/>
    <line x1="456" y1="0" x2="456" y2="900" stroke="#0B0B0B"/>
    <line x1="568" y1="0" x2="568" y2="900" stroke="#0B0B0B"/>
    <line x1="680" y1="0" x2="680" y2="900" stroke="#0B0B0B"/>
    <line x1="792" y1="0" x2="792" y2="900" stroke="#0B0B0B"/>
    <line x1="904" y1="0" x2="904" y2="900" stroke="#0B0B0B"/>
    <line x1="1016" y1="0" x2="1016" y2="900" stroke="#0B0B0B"/>
    <line x1="1128" y1="0" x2="1128" y2="900" stroke="#0B0B0B"/>
    <line x1="1240" y1="0" x2="1240" y2="900" stroke="#0B0B0B"/>
    <line x1="1320" y1="0" x2="1320" y2="900" stroke="#0B0B0B"/>
  </g>

  <!-- Left content block -->
  <g>
    <!-- Eyebrow -->
    <text x="120" y="190"
      fill="#6B6B6B"
      font-family="Inter, Arial, sans-serif"
      font-size="14"
      font-weight="600"
      letter-spacing="2">
      INSPECCIÓN TÉCNICA DE PROPIEDADES
    </text>

    <!-- Headline -->
    <text x="120" y="280"
      fill="#0B0B0B"
      font-family="Inter, Arial, sans-serif"
      font-size="54"
      font-weight="700">
      <tspan x="120" dy="0">Antes de comprar,</tspan>
      <tspan x="120" dy="76">inspecciona.</tspan>
      <tspan x="120" dy="76">Después puede ser tarde.</tspan>
    </text>

    <!-- Accent line -->
    <rect x="120" y="525" width="96" height="4" rx="2" fill="#1E3A8A"/>

    <!-- Subheadline -->
    <text x="120" y="585"
      fill="#3F3F46"
      font-family="Inter, Arial, sans-serif"
      font-size="22"
      font-weight="400">
      <tspan x="120" dy="0">Detectamos problemas visibles que pueden</tspan>
      <tspan x="120" dy="34">costarte millones, con un informe técnico claro</tspan>
      <tspan x="120" dy="34">y validado por especialistas.</tspan>
    </text>

    <!-- Primary button -->
    <g>
      <rect x="120" y="700" width="220" height="60" rx="8" fill="#0B0B0B"/>
      <text x="230" y="738"
        text-anchor="middle"
        fill="#FFFFFF"
        font-family="Inter, Arial, sans-serif"
        font-size="18"
        font-weight="600">
        Agendar inspección
      </text>
    </g>

    <!-- Secondary button -->
    <g>
      <rect x="356" y="700" width="190" height="60" rx="8" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/>
      <text x="451" y="738"
        text-anchor="middle"
        fill="#0B0B0B"
        font-family="Inter, Arial, sans-serif"
        font-size="18"
        font-weight="500">
        Ver informe real
      </text>
    </g>

    <!-- Bullet points -->
    <g>
      <circle cx="126" cy="808" r="4" fill="#1E3A8A"/>
      <text x="142" y="814"
        fill="#3F3F46"
        font-family="Inter, Arial, sans-serif"
        font-size="16"
        font-weight="400">
        Inspección técnica en terreno
      </text>

      <circle cx="126" cy="844" r="4" fill="#1E3A8A"/>
      <text x="142" y="850"
        fill="#3F3F46"
        font-family="Inter, Arial, sans-serif"
        font-size="16"
        font-weight="400">
        Informe con evidencia fotográfica
      </text>

      <circle cx="126" cy="880" r="4" fill="#1E3A8A"/>
      <text x="142" y="886"
        fill="#3F3F46"
        font-family="Inter, Arial, sans-serif"
        font-size="16"
        font-weight="400">
        Validado por especialista
      </text>
    </g>
  </g>

  <!-- Right visual block -->
  <g>
    <!-- Main image frame -->
    <rect x="820" y="120" width="500" height="640" rx="20" fill="#F4F4F5"/>
    <rect x="820" y="120" width="500" height="640" rx="20" stroke="#E4E4E7" stroke-width="1.5"/>

    <!-- Fake image composition -->
    <rect x="860" y="160" width="420" height="240" rx="14" fill="#D4D4D8"/>
    <rect x="860" y="420" width="200" height="140" rx="14" fill="#E4E4E7"/>
    <rect x="1080" y="420" width="200" height="140" rx="14" fill="#E4E4E7"/>
    <rect x="860" y="580" width="420" height="140" rx="14" fill="#FAFAFA" stroke="#E4E4E7"/>

    <!-- Labels inside visual -->
    <text x="890" y="290"
      fill="#52525B"
      font-family="Inter, Arial, sans-serif"
      font-size="18"
      font-weight="500">
      Reemplazar por imagen real
    </text>
    <text x="885" y="320"
      fill="#71717A"
      font-family="Inter, Arial, sans-serif"
      font-size="15"
      font-weight="400">
      Detalle de humedad / grieta / instalación
    </text>

    <text x="900" y="500"
      fill="#71717A"
      font-family="Inter, Arial, sans-serif"
      font-size="14"
      font-weight="500">
      Evidencia 1
    </text>

    <text x="1120" y="500"
      fill="#71717A"
      font-family="Inter, Arial, sans-serif"
      font-size="14"
      font-weight="500">
      Evidencia 2
    </text>

    <!-- Report card -->
    <text x="890" y="620"
      fill="#0B0B0B"
      font-family="Inter, Arial, sans-serif"
      font-size="16"
      font-weight="600">
      Informe técnico validado
    </text>
    <text x="890" y="650"
      fill="#52525B"
      font-family="Inter, Arial, sans-serif"
      font-size="14"
      font-weight="400">
      Hallazgos claros · evidencia fotográfica · firma profesional
    </text>

    <!-- Score chip -->
    <rect x="890" y="680" width="110" height="30" rx="15" fill="#EEF2FF"/>
    <text x="945" y="700"
      text-anchor="middle"
      fill="#1E3A8A"
      font-family="Inter, Arial, sans-serif"
      font-size="13"
      font-weight="600">
      Score técnico
    </text>
  </g>

  <!-- Brand -->
  <text x="120" y="80"
    fill="#0B0B0B"
    font-family="Inter, Arial, sans-serif"
    font-size="26"
    font-weight="700">
    Propscan
  </text>
</svg>